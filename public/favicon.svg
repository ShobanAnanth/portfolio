<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Chip body -->
  <rect x="10" y="10" width="12" height="12" rx="2" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Top pins -->
  <line x1="13" y1="10" x2="13" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="16" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="10" x2="19" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom pins -->
  <line x1="13" y1="22" x2="13" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="22" x2="19" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left pins -->
  <line x1="10" y1="13" x2="7" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="7" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="19" x2="7" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right pins -->
  <line x1="22" y1="13" x2="25" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="25" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="19" x2="25" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Inner dot -->
  <circle cx="16" cy="16" r="2" fill="white" opacity="0.9"/>
</svg>
